<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message sent | Ogundimbola Adesoji Raymond</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#061A2E;
    --navy:#0A2540;
    --white:#FFFFFF;
    --bg-soft:#F5F8FC;
    --muted:#64748B;
    --accent:#2F6FED;
    --line:rgba(10,37,64,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Inter', sans-serif;
    background:var(--bg-soft);
    color:var(--navy);
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    max-width:440px; width:100%;
    background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:44px 36px;
    text-align:center;
    box-shadow:0 30px 60px -30px rgba(6,26,46,0.25);
  }
  .dot{
    width:52px; height:52px; border-radius:50%;
    background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 22px; font-size:1.5rem;
  }
  h1{
    font-family:'Space Grotesk', sans-serif; font-size:1.6rem; color:var(--navy-deep);
    margin-bottom:12px;
  }
  p{color:var(--muted); font-size:1rem; margin-bottom:28px; line-height:1.6;}
  a.btn{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono', monospace; font-size:0.85rem;
    background:var(--navy-deep); color:#fff; text-decoration:none;
    padding:13px 24px; border-radius:6px;
    transition:background .2s ease, transform .2s ease;
  }
  a.btn:hover{background:var(--accent); transform:translateY(-2px);}
</style>
</head>
<body>
  <div class="card">
    <div class="dot">&#10003;</div>
    <h1>Message sent</h1>
    <p>Thanks for reaching out. Raymond gets this straight to his inbox and will get back to you soon.</p>
    <a class="btn" href="/">&larr; Back to the portfolio</a>
  </div>
</body>
</html>
